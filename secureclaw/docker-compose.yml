# SecureClaw Docker Compose — Full Stack Deployment
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f app    # Follow app logs
#   docker-compose down           # Stop all services

services:
  app:
    build: .
    container_name: secureclaw
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Persist runtime config (whitelist, vault, history, reminders)
      - secureclaw-config:/app/config
      # Docker socket for skill sandboxing (required for Docker-in-Docker skills)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); assert r.status_code == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  secureclaw-config:
    driver: local
